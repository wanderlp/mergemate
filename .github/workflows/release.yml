name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build + publish
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y publicar (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir binarios como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
          retention-days: 14

      - name: Crear GitHub Release (auto)
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        needs: build
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "Publicando release para tag ${tag}"
          gh release create "${tag}" \
            --title "MergeMate v${tag}" \
            --generate-notes \
            ./dist/*.exe \
            ./dist/*.dmg \
            ./dist/*.AppImage \
            ./dist/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
