name: CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint / Typecheck / e2e
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Compilar (necesario para tests e2e)
        run: npm run build

      - name: Instalar binarios de Playwright
        run: npx playwright install --with-deps

      - name: Instalar xvfb (solo Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Tests e2e (Playwright + Electron)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' npm run test:e2e
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:e2e

      - name: Subir reporte de Playwright si fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
